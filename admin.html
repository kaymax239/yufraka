<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Yufraka pedidos</title></head><body style="font-family:sans-serif;background:#fbf7f4;padding:20px"><h1>Pedidos Yufraka</h1><p>PIN 1234</p><input id="pin" type="password"/><button onclick="if(document.getElementById('pin').value==='1234'){document.getElementById('app').style.display='block'}">Entrar</button><div id="app" style="display:none"><div id="alert" style="background:#9b3d54;color:#fff;padding:12px;border-radius:12px;margin:12px 0"></div><pre id="list"></pre></div><p><a href="index.html">Tienda</a></p><script>function draw(){const list=JSON.parse(localStorage.getItem('yu_orders')||'[]');const hoy=list.filter(o=>o.when==='hoy').length;const man=list.filter(o=>o.when==='manana').length;document.getElementById('alert').textContent='Tienes '+hoy+' arreglos para hoy y '+man+' para mañana.';document.getElementById('list').textContent=JSON.stringify(list,null,2);}draw();</script></body></html>
